name: Apply Courier Hardening Task 4

on:
  push:
    branches:
      - feat/courier-operations-hardening
    paths:
      - .github/workflows/apply-courier-hardening-task4.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/courier-operations-hardening
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Task 4 changes
        run: python .github/scripts/apply-courier-hardening-task4.py
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Focused Task 4 tests
        run: npm test -w apps/api -- cancelOrder.service.test.ts orderStateMachine.test.ts courier.updateDeliveryStatus.concurrent.test.ts queuedDelivery.contract.test.ts
      - name: API regression tests
        run: npm test -w apps/api
      - name: API build
        run: npm run build -w apps/api
      - name: Commit verified Task 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/orders/cancelOrder.service.ts \
                  apps/api/src/modules/orders/restaurantOrders.routes.ts \
                  apps/api/src/modules/orders/orders.service.ts \
                  apps/api/src/modules/admin/admin.service.ts
          git commit -m "feat: add safe operational order cancellation"
          git push origin HEAD:feat/courier-operations-hardening
