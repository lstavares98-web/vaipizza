name: Apply Courier Hardening Task 3

on:
  push:
    branches:
      - feat/courier-operations-hardening
    paths:
      - .github/workflows/apply-courier-hardening-task3.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/courier-operations-hardening
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Task 3 changes
        run: python .github/scripts/apply-courier-hardening-task3.py
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Focused Task 3 tests
        run: npm test -w apps/api -- courierOperationalState.test.ts courierOperationalAvailability.test.ts courierOperationalEligibility.test.ts
      - name: API regression tests
        run: npm test -w apps/api
      - name: API build
        run: npm run build -w apps/api
      - name: Admin build
        run: npm run build -w apps/admin
      - name: Commit verified Task 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/admin/admin.routes.ts \
                  apps/api/src/modules/admin/admin.service.ts \
                  apps/api/src/modules/couriers/courier.service.ts \
                  apps/api/src/modules/dispatch/dispatch.service.ts \
                  apps/admin/src/pages/Couriers.tsx
          git commit -m "feat: add courier suspension controls"
          git push origin HEAD:feat/courier-operations-hardening
