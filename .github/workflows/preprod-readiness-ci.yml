name: Pre-production readiness CI

on:
  push:
    branches:
      - feat/pre-production-readiness
      - feat/phone-counter-orders
      - fix/geocode-provider-fallback
      - feat/customer-address-admin-reset
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: API tests
        run: npm run test -w apps/api

      - name: Customer tests
        run: npm run test -w apps/customer

      - name: API build
        run: npm run build -w apps/api

      - name: Admin build
        run: npm run build -w apps/admin

      - name: Restaurant build
        run: npm run build -w apps/restaurant

      - name: Customer build
        run: npm run build -w apps/customer

      - name: Courier build
        run: npm run build -w apps/courier
