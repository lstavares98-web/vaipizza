name: QA Live Transport Recovery

on:
  push:
    branches:
      - feature/qa-harness-safe
    paths:
      - qa-transport-recovery.trigger

jobs:
  transport-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_ENV: staging
      QA_API_URL: https://vaipizza-api-staging.onrender.com
      QA_CONFIRM: VAIPIZZA_STAGING_ONLY
      PRIMARY_RESTAURANT_SLUG: vaipizza
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QA_CUSTOMER_URL: https://vaipizza-cliente-staging.netlify.app
      QA_RESTAURANT_URL: https://vaipizza-gestao-staging.netlify.app
      QA_KDS_URL: https://vaipizza-cozinha-staging.netlify.app
      QA_COURIER_URL: https://vaipizza-estafeta-staging.netlify.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard database credential
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret is not configured; live transport recovery QA will not run."
            exit 1
          fi

      - name: Read and guard transport recovery group
        id: group
        shell: bash
        run: |
          GROUP="$(tr -d '[:space:]' < qa-transport-recovery.trigger)"
          case "$GROUP" in
            api) ;;
            *)
              echo "Unsupported or inert transport recovery group: $GROUP"
              exit 1
              ;;
          esac
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-run QA safety checks
        run: |
          npm run qa:typecheck
          npm run qa:test
          npm run test -w apps/api

      - name: Run live transport recovery group in staging
        shell: bash
        run: |
          NODE_ENV=test \
          JWT_ACCESS_SECRET="$GITHUB_SHA" \
          JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
          npm run qa:resilience:transport -w apps/api -- --group=${{ steps.group.outputs.group }}

      - name: Prepare ephemeral browser recovery fixture
        env:
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-recovery.json
        shell: bash
        run: |
          NODE_ENV=test \
          JWT_ACCESS_SECRET="$GITHUB_SHA" \
          JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
          npm run qa:browser-recovery:prepare -w apps/api -- --session-file="$QA_BROWSER_FIXTURE_FILE"

      - name: Install Chromium for browser recovery
        run: npx playwright install --with-deps chromium

      - name: Run live staging refresh and reopen recovery
        env:
          QA_STAGING_REFRESH: "1"
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-recovery.json
        run: npm run test:e2e -w apps/customer -- resilience-refresh.spec.ts --project=chromium-desktop

      - name: Record browser recovery evidence
        if: success()
        shell: bash
        run: |
          mkdir -p qa-artifacts/browser-refresh
          printf '%s\n' '{"status":"PASS","surfaces":["customer","restaurant","kds","courier"],"credentialsPersisted":false}' > qa-artifacts/browser-refresh/result.json

      - name: Cleanup ephemeral browser recovery fixture
        if: always()
        env:
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-recovery.json
        shell: bash
        run: |
          if [ -f "$QA_BROWSER_FIXTURE_FILE" ]; then
            NODE_ENV=test \
            JWT_ACCESS_SECRET="$GITHUB_SHA" \
            JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
            npm run qa:browser-recovery:cleanup -w apps/api -- --session-file="$QA_BROWSER_FIXTURE_FILE"
          else
            echo "No browser recovery fixture file remains to clean."
          fi

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-transport-recovery-${{ steps.group.outputs.group }}-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
