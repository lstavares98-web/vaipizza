name: Courier Hardening Frontend CI

on:
  push:
    branches:
      - feat/courier-operations-hardening

permissions:
  contents: read

jobs:
  courier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Courier unit tests
        run: npx tsx --test apps/courier/tests/*.test.ts
      - name: Restaurant frontend tests
        run: npx tsx --test apps/restaurant/tests/*.test.ts
      - name: Courier build
        run: npm run build -w apps/courier
      - name: Restaurant build
        run: npm run build -w apps/restaurant
