name: QA Browser Refresh Recovery

on:
  push:
    branches:
      - feature/qa-harness-safe
    paths:
      - apps/customer/e2e/resilience-refresh.spec.ts
      - apps/customer/e2e/resilience-ui.spec.ts
      - apps/customer/e2e/offline-customer.spec.ts
      - apps/customer/e2e/runtime-health.spec.ts
      - apps/customer/e2e/csp-diagnostic.spec.ts
      - apps/customer/e2e/helpers/socket-control.ts
      - apps/customer/e2e/helpers/staging-sessions.ts
      - apps/customer/e2e/helpers/qa-runtime.spec.ts
      - apps/customer/e2e/helpers/qa-runtime.ts
      - apps/customer/e2e/helpers/staging-urls.ts
      - apps/customer/e2e/helpers/surface-login.spec.ts
      - apps/customer/e2e/helpers/surface-login.ts
      - apps/customer/e2e/helpers/api-audit.ts
      - apps/customer/e2e/helpers/runtime-errors.spec.ts
      - apps/customer/e2e/helpers/runtime-errors.ts
      - apps/customer/src/pages/OrderDetail.tsx
      - apps/customer/playwright.config.ts
      - .github/workflows/qa-browser-refresh-recovery.yml

jobs:
  refresh-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging runtime contract test
        run: npm run test:e2e -w apps/customer -- helpers/qa-runtime.spec.ts --project=chromium-desktop

      - name: Run browser fixture contract test
        run: npm run test:e2e -w apps/customer -- helpers/surface-login.spec.ts --project=chromium-desktop

      - name: Run runtime error policy test
        run: npm run test:e2e -w apps/customer -- helpers/runtime-errors.spec.ts --project=chromium-desktop

      - name: Inspect effective staging CSP
        run: npm run test:e2e -w apps/customer -- csp-diagnostic.spec.ts --project=chromium-desktop

      - name: Discover UI state agreement spec
        run: npm run test:e2e -w apps/customer -- resilience-ui.spec.ts --project=chromium-desktop

      - name: Discover offline customer spec
        run: npm run test:e2e -w apps/customer -- offline-customer.spec.ts --project=chromium-desktop

      - name: Discover runtime health spec
        run: npm run test:e2e -w apps/customer -- runtime-health.spec.ts --project=chromium-desktop

      - name: Run refresh and reopen recovery test
        run: npm run test:e2e -w apps/customer -- resilience-refresh.spec.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-refresh-recovery-evidence
          path: |
            apps/customer/test-results/
            apps/customer/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
