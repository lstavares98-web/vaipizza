name: QA Live Browser Resilience

on:
  push:
    branches:
      - feature/qa-harness-safe
    paths:
      - qa-browser-resilience.trigger

jobs:
  browser-resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_ENV: staging
      QA_API_URL: https://vaipizza-api-staging.onrender.com
      QA_CONFIRM: VAIPIZZA_STAGING_ONLY
      PRIMARY_RESTAURANT_SLUG: vaipizza
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      QA_CUSTOMER_URL: https://vaipizza-cliente-staging.netlify.app
      QA_RESTAURANT_URL: https://vaipizza-gestao-staging.netlify.app
      QA_KDS_URL: https://vaipizza-cozinha-staging.netlify.app
      QA_COURIER_URL: https://vaipizza-estafeta-staging.netlify.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard staging credentials and trigger
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret is not configured; live browser QA will not run."
            exit 1
          fi
          GROUP="$(tr -d '[:space:]' < qa-browser-resilience.trigger)"
          case "$GROUP" in
            ui|offline|full) ;;
            *)
              echo "Unsupported or inert browser resilience group: $GROUP"
              exit 1
              ;;
          esac
          echo "QA_BROWSER_GROUP=$GROUP" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-run QA safety checks
        run: |
          npm run qa:typecheck
          npm run qa:test
          npm run test -w apps/api

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare desktop fixture
        if: ${{ env.QA_BROWSER_GROUP == 'ui' || env.QA_BROWSER_GROUP == 'full' }}
        env:
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-ui-desktop.json
        shell: bash
        run: |
          NODE_ENV=test \
          JWT_ACCESS_SECRET="$GITHUB_SHA" \
          JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
          npm run qa:browser-fixture:prepare -w apps/api -- --session-file="$QA_BROWSER_FIXTURE_FILE"

      - name: Run desktop multi-surface UI agreement
        if: ${{ success() && (env.QA_BROWSER_GROUP == 'ui' || env.QA_BROWSER_GROUP == 'full') }}
        env:
          QA_STAGING_UI: "1"
          QA_STAGING_REFRESH: "1"
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-ui-desktop.json
        run: npm run test:e2e -w apps/customer -- resilience-ui.spec.ts --project=chromium-desktop

      - name: Cleanup desktop fixture
        if: ${{ always() && (env.QA_BROWSER_GROUP == 'ui' || env.QA_BROWSER_GROUP == 'full') }}
        env:
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-ui-desktop.json
        shell: bash
        run: |
          if [ -f "$QA_BROWSER_FIXTURE_FILE" ]; then
            NODE_ENV=test \
            JWT_ACCESS_SECRET="$GITHUB_SHA" \
            JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
            npm run qa:browser-fixture:cleanup -w apps/api -- --session-file="$QA_BROWSER_FIXTURE_FILE"
          else
            echo "No desktop browser fixture remains to clean."
          fi

      - name: Prepare mobile fixture
        if: ${{ success() && (env.QA_BROWSER_GROUP == 'ui' || env.QA_BROWSER_GROUP == 'full') }}
        env:
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-ui-mobile.json
        shell: bash
        run: |
          NODE_ENV=test \
          JWT_ACCESS_SECRET="$GITHUB_SHA" \
          JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
          npm run qa:browser-fixture:prepare -w apps/api -- --session-file="$QA_BROWSER_FIXTURE_FILE"

      - name: Run mobile multi-surface UI agreement
        if: ${{ success() && (env.QA_BROWSER_GROUP == 'ui' || env.QA_BROWSER_GROUP == 'full') }}
        env:
          QA_STAGING_UI: "1"
          QA_STAGING_REFRESH: "1"
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-ui-mobile.json
        run: npm run test:e2e -w apps/customer -- resilience-ui.spec.ts --project=chromium-mobile

      - name: Cleanup mobile fixture
        if: ${{ always() && (env.QA_BROWSER_GROUP == 'ui' || env.QA_BROWSER_GROUP == 'full') }}
        env:
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-ui-mobile.json
        shell: bash
        run: |
          if [ -f "$QA_BROWSER_FIXTURE_FILE" ]; then
            NODE_ENV=test \
            JWT_ACCESS_SECRET="$GITHUB_SHA" \
            JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
            npm run qa:browser-fixture:cleanup -w apps/api -- --session-file="$QA_BROWSER_FIXTURE_FILE"
          else
            echo "No mobile browser fixture remains to clean."
          fi

      - name: Prepare offline fixture
        if: ${{ success() && (env.QA_BROWSER_GROUP == 'offline' || env.QA_BROWSER_GROUP == 'full') }}
        env:
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-offline.json
        shell: bash
        run: |
          NODE_ENV=test \
          JWT_ACCESS_SECRET="$GITHUB_SHA" \
          JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
          npm run qa:browser-fixture:prepare -w apps/api -- --session-file="$QA_BROWSER_FIXTURE_FILE"

      - name: Run customer offline and reconnect safety
        if: ${{ success() && (env.QA_BROWSER_GROUP == 'offline' || env.QA_BROWSER_GROUP == 'full') }}
        env:
          QA_STAGING_OFFLINE: "1"
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-offline.json
        run: npm run test:e2e -w apps/customer -- offline-customer.spec.ts --project=chromium-desktop

      - name: Cleanup offline fixture
        if: ${{ always() && (env.QA_BROWSER_GROUP == 'offline' || env.QA_BROWSER_GROUP == 'full') }}
        env:
          QA_BROWSER_FIXTURE_FILE: ${{ runner.temp }}/vaipizza-browser-offline.json
        shell: bash
        run: |
          if [ -f "$QA_BROWSER_FIXTURE_FILE" ]; then
            NODE_ENV=test \
            JWT_ACCESS_SECRET="$GITHUB_SHA" \
            JWT_REFRESH_SECRET="${GITHUB_SHA}refresh" \
            npm run qa:browser-fixture:cleanup -w apps/api -- --session-file="$QA_BROWSER_FIXTURE_FILE"
          else
            echo "No offline browser fixture remains to clean."
          fi

      - name: Record UI evidence
        if: ${{ success() && (env.QA_BROWSER_GROUP == 'ui' || env.QA_BROWSER_GROUP == 'full') }}
        shell: bash
        run: |
          mkdir -p qa-artifacts/browser-ui
          printf '%s\n' '{"status":"PASS","environment":"staging","projects":["chromium-desktop","chromium-mobile"],"surfaces":["customer","restaurant","kds","courier"],"authoritativeApiAudit":true}' > qa-artifacts/browser-ui/result.json

      - name: Record offline evidence
        if: ${{ success() && (env.QA_BROWSER_GROUP == 'offline' || env.QA_BROWSER_GROUP == 'full') }}
        shell: bash
        run: |
          mkdir -p qa-artifacts/browser-offline
          printf '%s\n' '{"status":"PASS","environment":"staging","project":"chromium-desktop","scenarios":["offline-before-checkout","lost-checkout-response","offline-reopen-reconnect"],"authoritativeApiAudit":true}' > qa-artifacts/browser-offline/result.json

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-browser-resilience-evidence
          path: |
            qa-artifacts/
            apps/customer/test-results/
            apps/customer/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
