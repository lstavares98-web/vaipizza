name: QA courier offer timeout

on:
  push:
    branches:
      - fix/courier-offer-timeout-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offer expiry UI regression test
        run: node --test apps/courier/tests/offer-expiry-ui.test.mjs
      - name: Build Estafeta
        run: npm run build -w apps/courier
