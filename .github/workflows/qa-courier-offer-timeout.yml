name: QA courier offer timeout

on:
  push:
    branches:
      - fix/courier-offer-timeout-ui

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      VITE_API_URL: https://vaipizza-api-staging.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offer expiry UI regression test
        run: node --test apps/courier/tests/offer-expiry-ui.test.mjs
      - name: Build Estafeta
        run: npm run build -w apps/courier
      - name: Guard staging token
        shell: bash
        run: test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo "NETLIFY_AUTH_TOKEN missing"; exit 1; }
      - name: Deploy Estafeta staging
        run: npx --yes netlify-cli@latest deploy --prod --auth "$NETLIFY_AUTH_TOKEN" --site b8dbc44d-390d-4027-834d-0250819f8c1e --filter apps/courier --dir apps/courier/dist --message "Courier timeout UI QA $GITHUB_SHA"
