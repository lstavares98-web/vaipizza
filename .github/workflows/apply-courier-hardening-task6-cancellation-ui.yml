name: Apply Courier Hardening Task6 Cancellation UI

on:
  push:
    branches:
      - feat/courier-operations-hardening
    paths:
      - .github/scripts/apply-courier-hardening-task6-cancellation-ui.py
      - .github/workflows/apply-courier-hardening-task6-cancellation-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scoped Task6 UI patch
        run: python .github/scripts/apply-courier-hardening-task6-cancellation-ui.py
      - name: Verify scoped diff
        run: |
          git diff --check
          git diff -- apps/restaurant/src/pages/OrdersDashboard.tsx
      - name: Commit patch
        run: |
          if git diff --quiet -- apps/restaurant/src/pages/OrdersDashboard.tsx; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/restaurant/src/pages/OrdersDashboard.tsx
          git commit -m "feat: add restaurant operational cancellation UI"
          git push origin HEAD:feat/courier-operations-hardening
