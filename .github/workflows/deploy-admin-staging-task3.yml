name: Deploy Admin Staging Task3

on:
  push:
    branches:
      - feat/courier-operations-hardening
    paths:
      - .github/workflows/deploy-admin-staging-task3.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: c791d22c-c4b8-45b0-983d-1378cca11327
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      VITE_API_URL: https://vaipizza-api-staging.onrender.com
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: redesign-vaipizza
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Admin staging
        run: npm run build -w apps/admin
      - name: Require Netlify token
        run: test -n "$NETLIFY_AUTH_TOKEN"
      - name: Deploy only Admin staging
        run: npx --yes netlify-cli@latest deploy --dir=apps/admin/dist --prod --site="$NETLIFY_SITE_ID" --filter @yummix/admin --message="courier hardening admin staging 11bc17dccf20777f2102981237b461060f8ef9a4"
