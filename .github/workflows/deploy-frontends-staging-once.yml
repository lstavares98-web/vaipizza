name: Deploy Frontends Staging Once

on:
  push:
    branches:
      - staging/deploy-frontends-2026-09-14
    paths:
      - deploy-frontends-staging.trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      VITE_API_URL: https://vaipizza-api-staging.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Guard staging token
        shell: bash
        run: test -n "${NETLIFY_AUTH_TOKEN:-}" || { echo "NETLIFY_AUTH_TOKEN missing"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Cliente
        run: npm run build -w apps/customer
      - name: Build Gestão
        run: npm run build -w apps/restaurant
      - name: Build Estafeta
        run: npm run build -w apps/courier
      - name: Deploy Cliente staging
        run: npx --yes netlify-cli@latest deploy --prod --auth "$NETLIFY_AUTH_TOKEN" --site 8f6a94ae-b550-47ac-88a0-d9ca28f79b65 --filter apps/customer --dir apps/customer/dist --message "Pickup MBWAY queued delivery staging $GITHUB_SHA"
      - name: Deploy Gestão staging
        run: npx --yes netlify-cli@latest deploy --prod --auth "$NETLIFY_AUTH_TOKEN" --site bfb4f12b-72a2-41ab-b528-aa896878d5eb --filter apps/restaurant --dir apps/restaurant/dist --message "Pickup MBWAY queued delivery staging $GITHUB_SHA"
      - name: Deploy Estafeta staging
        run: npx --yes netlify-cli@latest deploy --prod --auth "$NETLIFY_AUTH_TOKEN" --site b8dbc44d-390d-4027-834d-0250819f8c1e --filter apps/courier --dir apps/courier/dist --message "Pickup MBWAY queued delivery staging $GITHUB_SHA"
